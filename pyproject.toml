[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tensErr"
version = "0.4.1"
description = "tensErr computes uncertainties for tensor-valued Markov chain Monte Carlo ensembles using the gamma method."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch"]

[dependency-groups]
dev = [
  "pyerrors>=2.17",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tensErr*"]

[tool.setuptools.package-data]
tensErr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
