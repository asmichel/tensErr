[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tensErr"
version = "0.3.0"
description = "Torch implementation of dense UWerr gamma-method mean estimates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[dependency-groups]
dev = [
  "pyerrors>=2.17",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tensErr*"]

[tool.setuptools.package-data]
tensErr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
